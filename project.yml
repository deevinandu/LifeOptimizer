name: LifeOptimizer
options:
  bundleIdPrefix: com.lifeoptimizer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LifeOptimizer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes:
          - Info.plist
    info:
      path: iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeoptimizer.app
        CODE_SIGN_STYLE: Automatic
