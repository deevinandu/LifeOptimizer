name: LifeOptimizer
options:
  bundleIdPrefix: com.lifeoptimizer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LifeOptimizer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
        excludes:
          - Info.plist
      - path: LifeOptimizer
        excludes:
          # Exclude the old Laptop A app shell — iOS/LifeOptimizerApp.swift is canonical
          - App/LifeOptimizerApp.swift
          - App/ContentView.swift
          # Exclude old duplicate mock/demo files that now live under iOS/
          - Demo/MockDetectionProvider.swift
    info:
      path: iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeoptimizer.app
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: ARKit.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
